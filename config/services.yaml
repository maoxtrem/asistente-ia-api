# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.assistant_name: "%env(string:ASSISTANT_NAME)%"
    app.qdrant_host: "%env(string:QDRANT_HOST)%"
    app.chat_qdrant_collection: "%env(string:QDRANT_CHAT_COLLECTION)%"
    app.chat_qdrant_pdf_collection: "%env(string:QDRANT_CHAT_PDF_COLLECTION)%"
    app.embedding_provider_url: "%env(string:EMBEDDING_PROVIDER_URL)%"
    app.embedding_model: "%env(string:EMBEDDING_MODEL)%"
    app.chat_model: "%env(string:CHAT_MODEL)%"
    app.embedding_provider_kind: "%env(string:EMBEDDING_PROVIDER_KIND)%"
    app.embedding_api_key: "%env(string:EMBEDDING_API_KEY)%"
    app.openai_api_key: "%env(string:OPENAI_API_KEY)%"
    app.canvas_image_model: "%env(string:CANVAS_IMAGE_MODEL)%"
    app.canvas_image_size: "%env(string:CANVAS_IMAGE_SIZE)%"
    app.canvas_image_quality: "%env(string:CANVAS_IMAGE_QUALITY)%"
    app.canvas_image_output_format: "%env(string:CANVAS_IMAGE_OUTPUT_FORMAT)%"
    app.canvas_image_background: "%env(string:CANVAS_IMAGE_BACKGROUND)%"
    app.canvas_minio_bucket: "%env(string:MINIO_BUCKET_CANVAS_IMAGE)%"
    app.minio_url_expiration_hours: "%env(int:MINIO_URL_EXPIRATION_HOURS)%"
    app.chattoolpdf_model: "%env(string:CHATTOOLPDF_MODEL)%"
    app.chattoolpdf_max_history_messages: "%env(int:CHATTOOLPDF_MAX_HISTORY_MESSAGES)%"
    app.chattoolpdf_max_image_analyses: "%env(int:CHATTOOLPDF_MAX_IMAGE_ANALYSES)%"
    app.stirling_pdf_endpoint: "%env(string:STIRLING_PDF_ENDPOINT)%"
    app.gotenberg_endpoint: "%env(string:GOTENBERG_ENDPOINT)%"
    app.tika_url: "%env(string:TIKA_URL)%"
    app.canvas_image_environment: "%env(string:CANVAS_IMAGE_ENVIRONMENT)%"
    app.qdrant_allowed_document_kinds:
        - chat_knowledge
    app.default_retrieve_limit: 4
    app.chat_prompt_max_history_items: 4
    app.chat_prompt_max_vector_matches: 2
    app.greeting_instruction: "Responde al saludo de forma amable, breve y natural. ES OBLIGATORIO responder en el mismo idioma del último mensaje del usuario. Si el idioma no está claro, usa el locale de la aplicación como respaldo. No menciones detalles internos ni técnicos."
    app.clarification_instruction: "No tienes suficiente información para responder con confianza. Responde brevemente, pide una sola aclaración concreta y ES OBLIGATORIO responder en el mismo idioma del último mensaje del usuario. Si el idioma no está claro, usa el locale de la aplicación como respaldo. No menciones errores técnicos ni internos."

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $maxHistoryItems: "%app.chat_prompt_max_history_items%"
            $maxVectorMatches: "%app.chat_prompt_max_vector_matches%"

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"

    App\Service\Vector\VectorContextRetriever:
        arguments:
            $qdrantCollection: "%app.chat_qdrant_collection%"
            $allowedDocumentKinds: "%app.qdrant_allowed_document_kinds%"

    App\Service\Ai\Chat\ChatPromptBuilder: ~

    App\Contract\ChatProviderInterface: '@App\Service\Ai\Chat\OpenAiPlatformChatProvider'

    App\Service\Ai\Embedding\LocalJsonEmbeddingProvider:
        arguments:
            $providerUrl: "%app.embedding_provider_url%"
            $embeddingModel: "%app.embedding_model%"
        tags: ["app.embedding_provider"]

    App\Service\Ai\Embedding\OpenAiCompatibleEmbeddingProvider:
        arguments:
            $providerUrl: "%app.embedding_provider_url%"
            $embeddingModel: "%app.embedding_model%"
            $apiKey: "%app.embedding_api_key%"
        tags: ["app.embedding_provider"]

    App\Service\Ai\Embedding\EmbeddingProviderSelector:
        arguments:
            $providerKind: "%app.embedding_provider_kind%"
            $providers: !tagged_iterator app.embedding_provider

    App\Contract\EmbeddingProviderInterface: '@App\Service\Ai\Embedding\EmbeddingProviderSelector'

    App\Service\Assistant\AssistantResponder:
        arguments:
            $defaultRetrieveLimit: "%app.default_retrieve_limit%"
            $greetingInstruction: "%app.greeting_instruction%"
            $clarificationInstruction: "%app.clarification_instruction%"

    App\Service\Vector\IndexDocumentProcessor:
        arguments:
            $qdrantCollection: "%app.chat_qdrant_collection%"

    App\Controller\Api\ChatController:
        arguments:
            $maxHistoryItems: "%app.chat_prompt_max_history_items%"
            $assistantName: "%app.assistant_name%"

    App\Controller\Api\BootstrapController:
        arguments:
            $assistantName: "%app.assistant_name%"

    App\Controller\Api\HealthController:
        arguments:
            $assistantName: "%app.assistant_name%"

    App\Command\ReindexQdrantCollectionCommand:
        arguments:
            $qdrantCollection: "%app.chat_qdrant_collection%"

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    aws.s3.minio_internal_client:
        class: Aws\S3\S3Client
        arguments:
            - version: "latest"
              region: "us-east-1"
              endpoint: "%env(MINIO_ENDPOINT)%"
              use_path_style_endpoint: true
              credentials:
                  key: "%env(MINIO_ACCESS_KEY)%"
                  secret: "%env(MINIO_SECRET_KEY)%"

    aws.s3.minio_public_client:
        class: Aws\S3\S3Client
        arguments:
            - version: "latest"
              region: "us-east-1"
              endpoint: "%env(MINIO_PUBLIC_ENDPOINT)%"
              use_path_style_endpoint: true
              credentials:
                  key: "%env(MINIO_ACCESS_KEY)%"
                  secret: "%env(MINIO_SECRET_KEY)%"

    Aws\S3\S3Client: '@aws.s3.minio_internal_client'
    # ==============================================================
    # CONFIGURACIÓN DEL NUEVO SDK DE QDRANT (Aislado del legacy)
    # ==============================================================
    # 1. Configuramos el Config del SDK
    hkulekci.qdrant.config:
        class: Qdrant\Config
        arguments:
            $host: "%app.qdrant_host%" # Reutilizamos tu variable de entorno existente
            # Si en el futuro usas API Key, descomenta la siguiente línea y pásale la variable
            # $apiKey: '%env(QDRANT_API_KEY)%'

    # 2. Registramos el Builder sin instanciarlo globalmente
    hkulekci.qdrant.http_builder:
        class: Qdrant\Http\Builder

    # 3. Creamos el transporte HTTP usando el Builder como factory
    hkulekci.qdrant.transport:
        class: Qdrant\Http\Transport
        factory: ["@hkulekci.qdrant.http_builder", "build"]
        arguments:
            - "@hkulekci.qdrant.config"

    # 4. Registramos el cliente oficial de Qdrant bajo un alias explícito
    qdrant.official_client:
        class: Qdrant\Qdrant
        arguments:
            $transport: "@hkulekci.qdrant.transport"

    Qdrant\Qdrant: '@qdrant.official_client'
